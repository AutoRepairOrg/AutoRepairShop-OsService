apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-service
  namespace: autorepair
  labels:
    app: os-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: os-service
  template:
    metadata:
      labels:
        app: os-service
    spec:
      containers:
        - name: os-service
          image: DOCKERHUB_USERNAME/os-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ConnectionStrings__OsDatabase
              valueFrom:
                secretKeyRef:
                  name: os-service-secrets
                  key: db-connection-string
            - name: RabbitMQ__Host
              valueFrom:
                configMapKeyRef:
                  name: os-service-config
                  key: rabbitmq-host
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: os-service
  namespace: autorepair
spec:
  selector:
    app: os-service
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: os-service-hpa
  namespace: autorepair
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: os-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: os-service-config
  namespace: autorepair
data:
  rabbitmq-host: "rabbitmq-service"
  rabbitmq-port: "5672"
