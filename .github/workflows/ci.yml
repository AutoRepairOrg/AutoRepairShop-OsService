name: CI — OsService

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build, Test & Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage
        run: |
          dotnet test --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            --settings tests/OsService.Tests/Coverlet.runsettings

      - name: Check coverage threshold (80%)
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"coverage/**/coverage.opencover.xml" \
            -targetdir:"coverage/report" \
            -reporttypes:"TextSummary" \
            "-classfilters:-OsService.Infrastructure.Persistence.Migrations.*;-OsService.Infrastructure.Messaging.RabbitMq*"
          cat coverage/report/Summary.txt
          COVERAGE=$(grep "Line coverage" coverage/report/Summary.txt | grep -oP '\d+\.\d+')
          echo "Coverage: $COVERAGE%"
          python3 -c "import sys; c=float('$COVERAGE'); sys.exit(0 if c >= 80.0 else 1)" \
            || (echo "Coverage $COVERAGE% < 80%. Pipeline bloqueado." && exit 1)

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/report/

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t os-service:${{ github.sha }} .

      - name: Login to GHCR
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/master'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/os-service"
          docker tag os-service:${{ github.sha }} ${IMAGE}:${{ github.sha }}
          docker tag os-service:${{ github.sha }} ${IMAGE}:latest
          docker push ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/master'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          # Gera kubeconfig fresco a partir do cluster atual (Academy muda o endpoint a cada recreate).
          if ! STATUS=$(aws eks describe-cluster --name autorepair-eks --region us-east-1 --query 'cluster.status' --output text); then
            echo "Cluster autorepair-eks inacessível. Recrie o cluster no Academy e atualize os secrets AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY e AWS_SESSION_TOKEN."
            exit 1
          fi
          echo "Cluster autorepair-eks: ${STATUS}"
          aws eks update-kubeconfig --name autorepair-eks --region us-east-1

      - name: Ensure GHCR pull secret
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -z "$GHCR_TOKEN" ]; then
            echo "Secret GHCR_TOKEN ausente — necessário para o imagePullSecret ghcr-pull."
            exit 1
          fi
          kubectl create namespace autorepair --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-pull \
            --namespace autorepair \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="$GHCR_TOKEN" \
            --docker-email="${{ github.actor }}@users.noreply.github.com" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          kubectl apply -f k8s/deployment.yaml
          kubectl set image deployment/os-service \
            os-service=ghcr.io/${OWNER}/os-service:${{ github.sha }} \
            -n autorepair
          kubectl rollout status deployment/os-service -n autorepair --timeout=420s
          kubectl rollout status deployment/rabbitmq -n autorepair --timeout=180s

  branch-protection:
    name: Configure Branch Protection
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Apply branch protection
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Secret GHCR_TOKEN ausente — branch protection não alterada."
            exit 1
          fi
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/branches/master/protection \
            --input - <<EOF
          {
            "required_status_checks": {
              "strict": true,
              "contexts": [
                "Build, Test & Quality",
                "Docker Build"
              ]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "required_approving_review_count": 1,
              "dismiss_stale_reviews": true
            },
            "restrictions": null,
            "allow_force_pushes": false,
            "allow_deletions": false
          }
          EOF
