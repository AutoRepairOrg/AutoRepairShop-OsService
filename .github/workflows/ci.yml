name: CI — OsService

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Test & Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage
        run: |
          dotnet test --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            /p:CoverletOutputFormat=opencover

      - name: Check coverage threshold (80%)
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"coverage/**/coverage.opencover.xml" \
            -targetdir:"coverage/report" \
            -reporttypes:"TextSummary"
          cat coverage/report/Summary.txt
          COVERAGE=$(grep "Line coverage" coverage/report/Summary.txt | grep -oP '\d+\.\d+')
          echo "Coverage: $COVERAGE%"
          python3 -c "import sys; c=float('$COVERAGE'); sys.exit(0 if c >= 80.0 else 1)" \
            || (echo "Coverage $COVERAGE% < 80%. Pipeline bloqueado." && exit 1)

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/report/

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t os-service:${{ github.sha }} .

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag os-service:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/os-service:${{ github.sha }}
          docker tag os-service:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/os-service:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/os-service:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/os-service:latest

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Deploy
        run: |
          kubectl set image deployment/os-service \
            os-service=${{ secrets.DOCKERHUB_USERNAME }}/os-service:${{ github.sha }} \
            -n autorepair
          kubectl rollout status deployment/os-service -n autorepair --timeout=120s

  branch-protection:
    name: Configure Branch Protection
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Apply branch protection rules
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/branches/main/protection \
            --input - <<EOF
          {
            "required_status_checks": {
              "strict": true,
              "contexts": [
                "Build, Test & Quality",
                "Docker Build"
              ]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "required_approving_review_count": 1,
              "dismiss_stale_reviews": true
            },
            "restrictions": null,
            "allow_force_pushes": false,
            "allow_deletions": false
          }
          EOF
